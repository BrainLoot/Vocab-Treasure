nline.</li><li><b>Player name:</b> It is always the username. Own names cannot be entered.</li><li><b>Access:</b> Each child sees only their own progress, the teacher only their classes.</li><li><b>In the browser:</b> sign-in and progress are also kept on the device and are deleted when signing out. No cookies for advertising or analytics.</li><li><b>Deletion:</b> The teacher can delete accounts with their progress at any time, at the latest at the end of the school year.</li><li><b>Questions and information:</b> through the responsible teacher.</li></ul><p class="stand">As of October 2026</p>',fr:"<h2>Mentions légales</h2><p>Vocab Treasure est une offre d'apprentissage non commerciale pour les classes. Exploitation : BrainLoot. Contact : par l'enseignant·e responsable.</p><h2>Protection des données</h2><ul><li><b>Ce qui est enregistré :</b> un nom d'utilisateur sans lien avec la personne (p. ex. A1-Lama), la classe, la progression (mots exercés, points, crédits) et l'heure de la dernière activité. Aucun nom, aucune adresse e-mail, aucune photo, pas de publicité, pas de suivi.</li><li><b>Où :</b> chez Supabase, centre de données __ORT__. Le site lui-même est servi par GitHub Pages, qui traite brièvement les données de connexion techniquement nécessaires (p. ex. l'adresse IP).</li><li><b>Anonyme :</b> pour le fournisseur et pour les tiers, les données sont anonymes. Seul·e l'enseignant·e sait quel enfant a quel nom d'utilisateur ; cette liste n'est pas enregistrée en ligne.</li><li><b>Nom de joueur :</b> c'est toujours le nom d'utilisateur. On ne peut pas saisir son propre nom.</li><li><b>Accès :</b> chaque enfant ne voit que sa propre progression, l'enseignant·e seulement ses classes.</li><li><b>Dans le navigateur :</b> la connexion et la progression sont aussi gardées sur l'appareil et effacées à la déconnexion. Pas de cookies de publicité ou d'analyse.</li><li><b>Suppression :</b> l'enseignant·e supprime les comptes et leur progression à tout moment, au plus tard
